<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Movie App</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-900 text-white min-h-screen p-10">

    <h1 class="text-5xl font-bold text-center mb-10">
        Movie Search App
    </h1>

    <div class="flex justify-center gap-4">

        <input
            type="text"
            id="searchInput"
            placeholder="Search movie..."
            class="p-3 rounded-lg text-black w-80"
        >

        <button
            id="searchBtn"
            class="bg-blue-500 px-5 py-3 rounded-lg hover:bg-blue-700 transition"
        >
            Search
        </button>

    </div>

    <div
        id="movieContainer"
        class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-10"
    ></div>

    <script src="script.js"></script>

</body>

</html>
